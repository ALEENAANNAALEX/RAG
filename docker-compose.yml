version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5001/api
    ports:
      - "80:80"
    depends_on:
      - backend
