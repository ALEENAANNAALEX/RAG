<!DOCTYPE html>
<html>
<head>
    <title>Welcome Page</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --ink: #f4f4f4;
            --paper: #0b0b0b;
            --accent: #222222;
            --card: #141414;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            color: var(--ink);
            background: linear-gradient(to right, #0055ff 0%, #0033aa 30%, #001555 70%, #000000 100%);
            display: grid;
            place-items: center;
            padding: 32px 18px;
            position: relative;
            overflow: hidden;
        }

        main {
            position: relative;
            z-index: 1;
        }

        .wrap {
            width: min(880px, 100%);
            background: var(--card);
            border: 1px solid #242424;
            border-radius: 20px;
            padding: 40px clamp(22px, 5vw, 54px);
            box-shadow: 0 20px 60px var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .wrap::before {
            content: "";
            position: absolute;
            inset: -60px auto auto -40px;
            width: 220px;
            height: 220px;
            background: #1f1f1f;
            opacity: 0.5;
            border-radius: 50%;
            filter: blur(6px);
        }

        .eyebrow {
            font-family: "Trebuchet MS", "Lucida Sans", sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 12px;
            color: #b3b3b3;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: clamp(28px, 5vw, 46px);
            line-height: 1.1;
        }

        p {
            margin: 0 0 20px 0;
            font-size: clamp(16px, 2.5vw, 20px);
            color: #c9c9c9;
        }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: #9a9a9a;
        }

        @media (max-width: 520px) {
            .wrap {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="eyebrow"></div>
        <h1>Welcome to My Docker Container 🚀</h1>
        <p>Your HTML is live and serving from a container. Keep shipping small, solid changes.</p>
        <div class="footer">Updated on Feb 16, 2026</div>
    </main>
</body>
</html>
